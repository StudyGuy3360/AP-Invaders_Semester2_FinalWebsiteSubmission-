<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content ="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name = "keywords" content="template initial setup,html, css, links, futureUse">
    <meta name="author" content="Calvin Wiid 261004, Michelle van Vuuren 251015, Luca Vannucchi 261027, Danielle van der Veer 261165">
    <title>HTML template</title>
    <script type="module" src="js/script.js"></script>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class = "body1">

<div class="wrapper">
  <!-- Popflix heading -->
  <div class="logo-container">
    <h2>Popflix</h2>
    <p>MOVIES. ANYTIME. EVERY MOOD.</p>
  </div>

    <div class="slide-controls">
      <input type="radio" name="slide" id="login" checked>
      <input type="radio" name="slide" id="signup">
      <label for="login" class="slide login">Login</label>
      <label for="signup" class="slide signup">Signup</label>
      <div class="slider-tab"></div>
    </div>


<div class="welcome-text">
  <h3>welcome back!</h3>
  <p>Login to continue to your account</p>
</div>

    <!-- form -->
     <div class="title-text">
    <div class="form-inner">
      <!-- login form -->
      <form action="#" class="login">
        <div class="field">
          <input type="text" placeholder="Email or Username" required>
        </div>
        <div class="field">
          <input type="password" placeholder="Password" required>
        </div>
        <div class="pass-link"><a href="#">Forgot password?</a></div>
        <div class="field btn">
          <div class="btn-layer"></div>
          <input type="submit" value="Login">
        </div>
        <div class="signup-link">Already have an account? <a href="#">Signup</a></div>
      </form>

      <!-- signup form -->
      <form action="#" class="signup">
        <div class="field">
          <input type="text" placeholder="Email or Username" required>
        </div>
        <div class="field">
          <input type="password" placeholder="Password" required>
        </div>
        <div class="field">
          <input type="password" placeholder="Confirm password" required>
        </div>
        <div class="field btn">
          <div class="btn-layer"></div>
          <input type="submit" value="Signup">
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>

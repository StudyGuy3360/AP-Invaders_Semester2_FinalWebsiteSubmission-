<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="/public/css/main.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward_ios" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back_ios" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<>
    <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="/public/index.html">
                <img src="../public/assets/img/PopFlix_logo_primary_whiteTagline copy.png" alt="popFlixLogo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item mx-3">
                    <a class="nav-link fs-5" aria-current="page" id="active" href="#">Home</a>
                    </li>
                    <li class="nav-item mx-3">
                    <a class="nav-link fs-5" href="../public/pages/contentLibrary.html">Library</a>
                    </li>
                    <li class="nav-item mx-3">
                    <a class="nav-link fs-5" href="../public/pages/watchlist.html">Watchlist</a>
                    </li>
                </ul>
                <span class="navbar-text">
                    <form class="d-flex" role="search" id="movieSearchForm">
                        <button class="btn" type="submit">
                            <i class="fa-solid fa-magnifying-glass fs-5"></i>
                        </button>
                        <input class="form-control me-2 searchBox" type="search" id="movieSearchInput" placeholder="Search movies" aria-label="Search movies"/>
                    </form>
                </span>
            </div>
        </div>
    </nav>

    <div class="Background-Image">
        <!-- Top heading section -->
        <section class="content-section">
            <div class="info-container">
                <!-- Top heading title -->
                <div class="title-container">
                    <div class="logo-container title-info">
                        <h1></h1>
                    </div>
                </div>
                 <!-- content under title -->
               <div class="title-info">
                    <span class="title-info-metadata-item item-year">
                        <span>2026</span>
                    </span>
                    <span class="info-spacer"> | </span>
                    <span class="title-info-metadata-item item-maturity">
                        <span class="maturity-number"></span>
                    </span>
                    <span class="info-spacer"> | </span>
                    <span class="title-info-metadata-item item-vote">
                        <span class="duration vote-average"></span>
                    </span>
                    <span class="info-spacer"> | </span>
                    <span class="title-info-metadata-item item-language">
                        <span class="language"></span>
                    </span>
                </div>
                <!-- title description -->
                <div>
                    <div class="title-info-description">
                    </div>
                </div>
                <!-- buttons -->
                <div class="btn">
                    <button class="btn-play">Play Now</button>
                </div>
        </section>
        <!-- Recommandation -->
        <section class="Recommandation-section">
            <div class="title">
                <!-- Title on the left -->
                <div class="container-text">
                        <span class="Recommandation-text">Recommendation</span>
                </div>

                <!-- Arrows on the right -->
        <div class="arrows-position">
                <div class="arrow">
                    <div class="circle" id="left">
                        <span class="material-symbols-outlined">arrow_back_ios</span>
                </div>
                    <div class="circle" id="right">
                        <span class="material-symbols-outlined">arrow_forward_ios</span>
                    </div>
                </div>
            </div>
        </div>

            <div class="wrapper-field" id="imageContainer">
                <!-- carousel  -->
            </div>
        </section>


        <!-- Bootstrap Js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/api.js"></script>

</body>
</html>

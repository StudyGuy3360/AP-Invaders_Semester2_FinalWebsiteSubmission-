<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="PopFlix, watchlist, favourites, movies">
    <meta name="author" content="Danielle van der Veer">

    <title>Watchlist | PopFlix</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="watchlistBody">

  <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="../index.html">
                <img src="../assets/img/PopFlix_logo_primary_whiteTagline.png" alt="popFlixLogo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item mx-3">
                    <a class="nav-link fs-5" aria-current="page" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item mx-3">
                    <a class="nav-link fs-5" href="../pages/contentLibrary.html">Library</a>
                    </li>
                    <li class="nav-item mx-3">
                    <a class="nav-link fs-5" id="active" href="#">Watchlist</a>
                    </li>
                </ul>
                <span class="navbar-text">
                    <form class="d-flex" role="search" id="movieSearchForm">
                        <button class="btn" type="submit">
                            <i class="fa-solid fa-magnifying-glass fs-5"></i>
                        </button>
                        <input class="form-control me-2 searchBox" type="search" id="movieSearchInput" placeholder="Search movies" aria-label="Search movies"/>
                    </form>
                </span>
            </div>
        </div>
    </nav>

    



<div class="headerSection">
 <h1 id="pageTitle" class="textCenter">My Watchlist</h1>
</div>

   
<div class="tabs text-center my-3">
 <button id="watchlistBtn"  class="btn btn-outline-primary mx-2">Watchlist</button>
 <button id="favouritesBtn" class="btn btn-outline-secondary mx-2">Favourites</button>
</div>

   
<div class="container-fluid px-4 my-4">
        
<div id="watchlistPage" aria-label="My Watchlist"></div>
 <div id="favouritesPage" aria-label="My Favourites" style="display: none;"></div>
</div>

   


<script src="../js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
